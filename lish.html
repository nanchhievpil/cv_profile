<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOPENH Price Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f6f6f6;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#fff;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    padding:40px;
}

h1{
    text-align:center;
    font-size:42px;
    margin-bottom:30px;
}

.product{
    display:flex;
    gap:40px;
    align-items:flex-start;
    flex-wrap:wrap;
}

.image{
    flex:1;
    min-width:250px;
    text-align:center;
}

.image img{
    width:250px;
    max-width:100%;
}

.content{
    flex:2;
}

h2{
    text-align:center;
    font-size:38px;
    margin-bottom:25px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:30px;
}

table th,
table td{
    border:2px solid #d61b82;
    padding:14px;
    text-align:center;
    font-size:22px;
}

table th{
    background:#d61b82;
    color:#fff;
}

input{
    width:100%;
    padding:15px;
    font-size:22px;
    border:2px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:16px;
    font-size:22px;
    background:#d61b82;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#b0156b;
}

.total{
    margin-top:25px;
    font-size:30px;
    text-align:center;
    font-weight:bold;
    color:#d61b82;
}

@media(max-width:768px){

.product{
    flex-direction:column;
}

}
</style>

</head>
<body>

<div class="container">

<h1>LOPENH PRICE LIST</h1>

<div class="product">

<div class="image">
<img src="cream15g.png" alt="Cream">
</div>

<div class="content">

<h2>CREAM 15g</h2>

<table>

<tr>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>

<tr>
<td>1</td>
<td>$15</td>
<td>$15</td>
</tr>

<tr>
<td>12</td>
<td>$10</td>
<td>$120</td>
</tr>

<tr>
<td>36</td>
<td>$9</td>
<td>$324</td>
</tr>

<tr>
<td>60</td>
<td>$8</td>
<td>$480</td>
</tr>

<tr>
<td>120</td>
<td>$7.5</td>
<td>$900</td>
</tr>

<tr>
<td>240</td>
<td>$7</td>
<td>$1680</td>
</tr>

<tr>
<td>600</td>
<td>$6.5</td>
<td>$3900</td>
</tr>

</table>

<input type="number" id="qty" placeholder="Enter Quantity">

<button onclick="calculate()">
Calculate
</button>

<div class="total" id="grandTotal">
Grand Total : $0.00
</div>

</div>

</div>

</div>

<script>

function calculate(){

let qty = Number(document.getElementById("qty").value);

let price = 15;

if(qty>=600){
    price=6.5;
}
else if(qty>=240){
    price=7;
}
else if(qty>=120){
    price=7.5;
}
else if(qty>=60){
    price=8;
}
else if(qty>=36){
    price=9;
}
else if(qty>=12){
    price=10;
}
else{
    price=15;
}

let total = qty * price;

document.getElementById("grandTotal").innerHTML =
"Grand Total : $" + total.toFixed(2);

}

</script>

</body>
</html>
