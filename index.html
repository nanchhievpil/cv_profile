
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#229ED9" />
  <meta name="description" content="Chhiev Profile Mini App" />

  <title>Chhiev Profile</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* ========================================
       RESET & VARIABLES
    ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #229ed9;
      --primary-dark: #147fba;
      --primary-light: #e5f4ff;

      --bg: #f4f8fc;
      --card: #ffffff;
      --text: #17212b;
      --muted: #7b8794;
      --border: #e6edf3;

      --success: #16a34a;
      --shadow: 0 8px 28px rgba(30, 80, 120, 0.07);

      --radius-lg: 18px;
      --radius-xl: 24px;
    }

    body.dark {
      --bg: #101820;
      --card: #1a2834;
      --text: #f5f7fa;
      --muted: #a6b4c1;
      --border: #2c3d4b;
      --primary-light: #203d50;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;

      transition:
        background 0.3s ease,
        color 0.3s ease;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ========================================
       APP CONTAINER
    ======================================== */

    .app {
      width: 100%;
      max-width: 680px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 24px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #35b9f0, #147fba);
      color: white;

      font-size: 15px;
      font-weight: 800;

      box-shadow: 0 5px 15px rgba(34, 158, 217, 0.25);
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Replace CP with your profile image if needed */
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand h1 {
      font-size: 19px;
      font-weight: 750;
      letter-spacing: -0.4px;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: var(--card);
      color: var(--text);

      font-size: 18px;
      transition: transform 0.2s, background 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* ========================================
       HERO
    ======================================== */

    .hero {
      position: relative;
      margin: 8px 16px 28px;
      padding: 28px 23px;

      border-radius: var(--radius-xl);
      overflow: hidden;

      color: white;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(255, 255, 255, 0.22),
          transparent 35%
        ),
        radial-gradient(
          circle at 0% 100%,
          rgba(255, 255, 255, 0.08),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #2bb5ed 0%,
          #168ac0 55%,
          #126ba3 100%
        );

      box-shadow: 0 12px 30px rgba(34, 158, 217, 0.2);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -50px;
      bottom: -65px;

      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      box-shadow:
        0 0 0 20px rgba(255, 255, 255, 0.03),
        0 0 0 40px rgba(255, 255, 255, 0.025);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      padding: 6px 11px;
      border-radius: 30px;

      background: rgba(255, 255, 255, 0.17);

      font-size: 12px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h2 {
      font-size: 29px;
      line-height: 1.15;
      letter-spacing: -0.9px;
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 430px;
      font-size: 14px;
      line-height: 1.65;
      opacity: 0.92;
      margin-bottom: 22px;
    }

    .hero-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      max-width: 260px;

      padding: 13px 16px;
      border: none;
      border-radius: 14px;

      background: white;
      color: #168ac0;

      font-size: 14px;
      font-weight: 750;

      transition: transform 0.2s;
    }

    .hero-btn:active {
      transform: scale(0.97);
    }

    .hero-btn span {
      font-size: 22px;
      line-height: 1;
    }

    /* ========================================
       MAIN CONTAINER
    ======================================== */

    .container {
      padding: 0 16px;
    }

    .section-title {
      margin-bottom: 16px;
    }

    .section-title h2 {
      font-size: 21px;
      letter-spacing: -0.5px;
    }

    .section-title p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* ========================================
       MENU GRID
    ======================================== */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .menu-card {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      width: 100%;
      min-height: 154px;
      padding: 16px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background: var(--card);
      color: var(--text);
      text-align: left;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      border-color: rgba(34, 158, 217, 0.4);
      box-shadow: 0 12px 28px rgba(30, 80, 120, 0.11);
    }

    .menu-card:active {
      transform: scale(0.97);
    }

    .menu-icon {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;
      font-size: 22px;

      margin-bottom: 18px;
    }

    .menu-info {
      min-width: 0;
      padding-right: 4px;
    }

    .menu-info h3 {
      font-size: 15px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .menu-info p {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .arrow {
      position: absolute;
      top: 17px;
      right: 15px;

      color: var(--muted);
      font-size: 23px;
      line-height: 1;
    }

    /* ========================================
       ABOUT ME / SUBMENU
    ======================================== */

    .about-wrapper {
      grid-column: 1 / -1;
    }

    .about-main {
      min-height: 120px;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    .about-main .menu-icon {
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .about-main .menu-info {
      flex: 1;
    }

    .about-main .arrow {
      transform: rotate(90deg);
      transition: transform 0.25s;
    }

    .about-main.open .arrow {
      transform: rotate(-90deg);
    }

    .submenu {
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .submenu.show {
      display: grid;
      animation: slideDown 0.25s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sub-card {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
      padding: 13px 12px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: var(--card);
      color: var(--text);
      text-align: left;

      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
    }

    .sub-card:active {
      transform: scale(0.97);
    }

    .sub-icon {
      width: 35px;
      height: 35px;
      border-radius: 11px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
      flex-shrink: 0;
    }

    .sub-card h4 {
      font-size: 13px;
      font-weight: 700;
    }

    .sub-card p {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    /* ========================================
       CONTACT CARD
    ======================================== */

    .contact-card {
      grid-column: 1 / -1;
      min-height: auto;

      flex-direction: row;
      align-items: center;
      gap: 13px;
      padding: 15px 16px;
    }

    .contact-card .menu-icon {
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .contact-card .menu-info {
      flex: 1;
    }

    /* ========================================
       ICON COLORS
    ======================================== */

    .blue   { background: #e5f4ff; }
    .purple { background: #f0eaff; }
    .orange { background: #fff0df; }
    .pink   { background: #ffe7f0; }
    .red    { background: #ffe6e6; }
    .green  { background: #e3f8eb; }
    .yellow { background: #fff7d9; }
    .cyan   { background: #e0f8ff; }
    .teal   { background: #e0f7f4; }
    .lime   { background: #eef8d9; }
    .indigo { background: #e9eaff; }

    body.dark .menu-icon,
    body.dark .sub-icon {
      filter: brightness(0.78);
    }

    /* ========================================
       FOOTER
    ======================================== */

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
      padding: 35px 20px 15px;
    }

    /* ========================================
       TOAST
    ======================================== */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;

      transform: translate(-50%, 20px);

      background: #17212b;
      color: white;

      padding: 11px 18px;
      border-radius: 12px;

      font-size: 13px;
      white-space: nowrap;

      opacity: 0;
      pointer-events: none;

      transition: 0.25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (min-width: 500px) {
      .menu-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .about-wrapper {
        grid-column: span 2;
      }

      .contact-card {
        grid-column: span 1;
      }

      .hero {
        margin-left: 20px;
        margin-right: 20px;
      }

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }
    }

    @media (max-width: 360px) {
      .header {
        padding-left: 14px;
        padding-right: 14px;
      }

      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .hero {
        margin-left: 12px;
        margin-right: 12px;
        padding: 24px 20px;
      }

      .hero h2 {
        font-size: 25px;
      }

      .menu-grid {
        gap: 9px;
      }

      .menu-card {
        min-height: 140px;
        padding: 13px;
      }

      .menu-icon {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      .submenu {
        gap: 8px;
      }

      .sub-card {
        padding: 11px 9px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="header">

      <div class="brand">
        <div class="avatar">
          
          <img src="img/chhiev.jpg" alt="Chhiev Profile">
        
        </div>

        <div>
          <h1>Chhiev Profile</h1>
          <p>Personal Space</p>
        </div>
      </div>

      <div class="header-actions">
        <button
          class="icon-btn"
          id="themeBtn"
          aria-label="Toggle dark mode"
          title="Toggle theme"
        >
          🌙
        </button>
      </div>

    </header>

    <!-- =====================================
         HERO
    ====================================== -->

    <section class="hero">

      <div class="hero-content">

        <span class="hero-badge">✨ Welcome</span>

        <h2>Explore My World</h2>

        <p>
          Discover my profile, tools, media, learning resources,
          and creative works in one place.
        </p>

        <button class="hero-btn" data-link="home.html">
          Explore Profile
          <span>→</span>
        </button>

      </div>

    </section>

    <!-- =====================================
         MAIN MENU
    ====================================== -->

    <main class="container">

      <div class="section-title">
        <h2>Explore</h2>
        <p>Choose a section to continue</p>
      </div>

      <div class="menu-grid">

        <!-- =================================
             ABOUT ME + SUBMENU
        ================================== -->

        <div class="about-wrapper">

          <button class="menu-card about-main" id="aboutBtn">

            <div class="menu-icon blue">👤</div>

            <div class="menu-info">
              <h3>About Me</h3>
              <p>Personal profile & information</p>
            </div>

            <span class="arrow">›</span>

          </button>

          <!-- Submenu -->
          <div class="submenu" id="aboutSubmenu">

            <button class="sub-card" data-link="loan.html">
              <div class="sub-icon teal">💰</div>
              <div>
                <h4>Loan</h4>
                <p>Loan information</p>
              </div>
            </button>

            <button class="sub-card" data-link="income.html">
              <div class="sub-icon lime">📈</div>
              <div>
                <h4>Income</h4>
                <p>Income information</p>
              </div>
            </button>

          </div>

        </div>

        <!-- =================================
             RESUME
        ================================== -->

        <button class="menu-card" data-link="resume.html">

          <div class="menu-icon purple">📄</div>

          <div class="menu-info">
            <h3>Resume</h3>
            <p>Experience & skills</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             PORTFOLIO
        ================================== -->

        <button class="menu-card" data-link="portfolio.html">

          <div class="menu-icon orange">🎨</div>

          <div class="menu-info">
            <h3>Portfolio</h3>
            <p>My creative works</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             AI CAPTION
        ================================== -->

        <button
          class="menu-card"
          data-link="https://ai-caption-generator-ls5y.onrender.com/"
        >

          <div class="menu-icon pink">✍️</div>

          <div class="menu-info">
            <h3>AI Caption</h3>
            <p>AI caption generator</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             VIDEO
        ================================== -->

        <button class="menu-card" data-link="video.html">

          <div class="menu-icon red">🎬</div>

          <div class="menu-info">
            <h3>Video</h3>
            <p>Watch videos</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             MUSIC
        ================================== -->

        <button class="menu-card" data-link="music.html">

          <div class="menu-icon green">🎵</div>

          <div class="menu-info">
            <h3>Music</h3>
            <p>Listen to music</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             BOOKS
        ================================== -->

        <button class="menu-card" data-link="book.html">

          <div class="menu-icon yellow">📚</div>

          <div class="menu-info">
            <h3>Books</h3>
            <p>Read books</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             COURSE
        ================================== -->

        <button class="menu-card" data-link="lessons.html">

          <div class="menu-icon cyan">🎓</div>

          <div class="menu-info">
            <h3>Course</h3>
            <p>Learning resources</p>
          </div>

          <span class="arrow">›</span>

        </button>

        <!-- =================================
             CONTACT
        ================================== -->

        <button class="menu-card contact-card" data-link="contact.html">

          <div class="menu-icon indigo">📞</div>

          <div class="menu-info">
            <h3>Contact</h3>
            <p>Get in touch with me</p>
          </div>

          <span class="arrow">›</span>

        </button>

      </div>

    </main>

    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="footer">
      <p>© 2026 Chhiev Profile</p>
      <p>Made with ❤️</p>
    </footer>

  </div>

  <!-- Toast Message -->
  <div class="toast" id="toast">Opening...</div>

  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    /* ======================================
       TELEGRAM MINI APP
    ====================================== */

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Telegram colors
      if (tg.setHeaderColor) {
        tg.setHeaderColor("#f4f8fc");
      }

      if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#f4f8fc");
      }
    }

    /* ======================================
       HAPTIC FEEDBACK
    ====================================== */

    function haptic(type = "light") {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(type);
      }
    }

    /* ======================================
       TOAST
    ====================================== */

    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1200);
    }

    /* ======================================
       ABOUT ME SUBMENU
    ====================================== */

    const aboutBtn = document.getElementById("aboutBtn");
    const aboutSubmenu = document.getElementById("aboutSubmenu");

    aboutBtn.addEventListener("click", () => {
      const isOpen = aboutSubmenu.classList.toggle("show");

      aboutBtn.classList.toggle("open", isOpen);

      haptic("light");
    });

    /* ======================================
       OPEN LINKS
    ====================================== */

    document.querySelectorAll("[data-link]").forEach((button) => {

      button.addEventListener("click", () => {

        const link = button.dataset.link;

        if (!link) return;

        haptic("light");

        // External URL
        if (link.startsWith("http://") || link.startsWith("https://")) {

          if (tg?.openLink) {
            tg.openLink(link);
          } else {
            window.open(link, "_blank", "noopener,noreferrer");
          }

          return;
        }

        // Internal HTML page
        // Example: loan.html, resume.html, video.html
        window.location.href = link;

      });

    });

    /* ======================================
       DARK MODE
    ====================================== */

    const themeBtn = document.getElementById("themeBtn");

    let darkMode = false;

    themeBtn.addEventListener("click", () => {

      darkMode = !darkMode;

      document.body.classList.toggle("dark", darkMode);

      themeBtn.textContent = darkMode ? "☀️" : "🌙";

      // Update Telegram colors
      if (tg) {
        if (tg.setHeaderColor) {
          tg.setHeaderColor(darkMode ? "#101820" : "#f4f8fc");
        }

        if (tg.setBackgroundColor) {
          tg.setBackgroundColor(darkMode ? "#101820" : "#f4f8fc");
        }
      }

      haptic("light");

    });

    /* ======================================
       TELEGRAM USER INFO (OPTIONAL)
    ====================================== */

    // You can access Telegram user information
    // when the Mini App is opened inside Telegram.
    //
    // Example:
    //
    // const user = tg?.initDataUnsafe?.user;
    // console.log(user);

  </script>

</body>
</html>
